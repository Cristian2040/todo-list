<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List - Gestión de Tareas</title>
    <meta name="description" content="Una aplicación de lista de tareas moderna y minimalista.">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Mis Tareas</h1>
            <p id="date-display"></p>
        </header>

        <main>
            <section class="input-section">
                <form id="todo-form">
                    <input type="text" id="todo-input" placeholder="¿Qué necesitas hacer hoy?" autocomplete="off" aria-label="Nueva tarea">
                    <button type="submit" id="add-btn" aria-label="Agregar tarea">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    </button>
                </form>
            </section>

            <section class="controls-section">
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">Todas</button>
                    <button class="filter-btn" data-filter="active">Pendientes</button>
                    <button class="filter-btn" data-filter="completed">Completadas</button>
                </div>
            </section>

            <section class="list-section">
                <ul id="todo-list">
                    <!-- Tasks will be injected here -->
                </ul>
                <div id="empty-state" class="hidden">
                    <p>No hay tareas aquí. ¡Agrega una nueva!</p>
                </div>
            </section>
        </main>

        <footer>
            <span id="items-left">0 tareas pendientes</span>
            <button id="clear-completed" class="hidden">Borrar completadas</button>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
